al commitment · version 2.4','chat'],['10:58:56','Interruption handled','Response playback interrupted; question preserved','zap'],['10:58:22','Answer extracted','Yes → pending rule validation','check'],['10:57:44','Recording manifest checked','Recording unavailable in HTML mockup','file']].map(a=>`<div class="activity-item"><div class="activity-icon">${ic(a[3])}</div><div class="activity-content"><strong>${a[1]}</strong><br>${a[2]}<small>${a[0]} SGT</small></div></div>`).join('')}</div></div><div class="card card-pad"><div class="card-heading"><div><h2>Operational controls</h2><p>Live handling and monitoring requirements</p></div></div>${[['Barge-in signals','Model stops speaking when customer interrupts'],['Session lifecycle','Created → Active → Finalizing → Finalized'],['Human escalation','Authorized reviewer notified; outcome held'],['Evidence quality','Recording / transcript reconciliation barrier'],['Data isolation','Market/role-aware media and transcript access']].map(x=>`<div class="row" style="align-items:start;padding:12px 0;border-bottom:1px solid var(--line)"><span style="color:#289172">${ic('check','sm')}</span><div><b style="font-size:11px">${x[0]}</b><div class="small muted" style="margin-top:4px">${x[1]}</div></div></div>`).join('')}</div></div>`}

function reviewsPage(){return `${pageHead('HUMAN ACCOUNTABILITY','Compliance Reviews','Review evidence, record findings, apply maker-checker controls and close with documented reasons.',button('Export review queue','exportReviews','','download')+button('Assign work','assignReviewer','primary','users'))}<div class="layout cols-4" style="margin-bottom:19px">${kpi('Open findings','43','Across active cases','shield',true)}${kpi('Critical findings','8','Require immediate triage','alert')}${kpi('Under review','19','Assigned to reviewers','users')}${kpi('Awaiting checker','6','Approval required','check')}</div><div class="layout cols-2"><div class="card card-pad"><div class="card-heading"><div><h2>Findings queue</h2><p>Selected findings from synthetic callback records</p></div>${badge('3 visible','gray')}</div><div class="stack">${reviewItems.map(r=>`<div class="review-card" data-review="${r.id}"><div class="activity-icon" style="background:${r.severity==='Critical'?'#ffe9ec':'#f4f5f7'};color:${r.severity==='Critical'?'#bc2a3f':'#7c8798'}">${ic('flag')}</div><div style="flex:1"><div class="row between"><strong>${r.title}</strong>${badge(r.severity,r.severity==='Critical'?'red':r.severity==='High'?'amber':'blue')}</div><div class="small muted" style="margin:8px 0">${r.case} · ${r.question}</div><div class="row between">${badge(r.status,'gray')}<span class="small muted">${r.created}</span></div></div></div>`).join('')}</div></div><div class="card card-pad">${(()=>{let r=reviewItems.find(x=>x.id===state.activeReview)||reviewItems[0];return `<div class="card-heading"><div><h2>Review dossier</h2><p>${r.id} · ${r.case}</p></div>${badge(r.severity,r.severity==='Critical'?'red':'amber')}</div><h3 style="font-size:16px;line-height:1.4;margin:0 0 12px">${r.title}</h3><p class="small muted" style="line-height:1.7">${r.description}</p><div class="divider"></div><div class="info-grid" style="grid-template-columns:1fr 1fr"><div class="info-tile"><label>Assigned reviewer</label><strong>$ function indexItems(){let out=[];for(const c of cases){let p=findPol(c.pid);out.push({type:'Callback Case',id:c.id,title:`${c.id} · ${p.customer}`,desc:`${c.status}. ${c.script}. ${p.product}. ${c.outcome}`,target:'case:'+c.id,terms:[c.id,c.status,c.outcome,c.script,p.customer,p.id,p.product,c.owner].join(' ')});}for(const p of policies)out.push({type:'Policy & Sale',id:p.id,title:`${p.id} · ${p.customer}`,desc:`${p.product} · ${p.channel} · Risk: ${p.risk} (${p.score}/100) · FSC ${p.fsc}`,target:'policy:'+p.id,terms:[p.id,p.customer,p.client,p.fsc,p.product,p.family,p.channel,...p.factors].join(' ')});for(const s of scripts)out.push({type:'Script',id:s.id,title:`${s.name} · v${s.version}`,desc:`${s.family} · ${s.questions.length} questions · ${s.status} · ${s.rules}`,target:'script:'+s.id,terms:[s.name,s.id,s.family,...s.questions.map(q=>q.text)].join(' ')});for(const r of reviewItems)out.push({type:'Compliance Finding',id:r.id,title:r.title,desc:`${r.case} · ${r.question} · ${r.severity} · ${r.status}`,target:'review:'+r.id,terms:[r.title,r.id,r.case,r.question,r.description].join(' ')});for(let i=0;i<transcript.length;i++){let t=transcript[i];out.push({type:'Transcript Segment',id:'SEG-'+(i+1),title:`${t.who} at ${t.time} · ${t.qid}`,desc:t.text,target:'transcript:'+t.sec,terms:[t.who,t.text,t.qid,t.time].join(' ')})}return out}

case'voiceStart':state.voice.running=!state.voice.running;state.voice.seconds=0;if(!state.voice.running)toast('Demo session ended. No actual audio recorded.');break;
case'voiceNext':if(!state.voice.running){toast('Start the demo session first.');return;}state.voice.step=Math.min(state.voice.step+1,6);state.voice.seconds+=31;toast('Advanced to the next approved question (simulation).');break;
case'exportCases':downloadCsv('call360_cases_demo.csv',['case_id','policy_id','risk','status','attempts','script_version'],cases.map(c=>[c.id,c.pid,c.risk,c.status,c.attempts,c.script]));toast('Synthetic case CSV exported.');return;
case'exportReviews':downloadCsv('call360_reviews_demo.csv',['review_id','case_id','title','severity','status'],reviewItems.map(r=>[r.id,r.case,r.title,r.severity,r.status]));toast('Synthetic review queue exported.');return;
case'exportAudit':if(!authAdmin())return;downloadCsv('call360_audit_demo.csv',['time','actor','action','object','detail'],[...state.audit,...actorLog].map(l=>[l.time,l.actor,l.action,l.object,l.detail]));toast('Demo audit CSV exported.');return;
case'exportReport':downloadCsv('call360_report_demo.csv',['metric','value','note'],[['open_cases','1284','synthetic'],['due_today','128','synthetic'],['completion_rate','72.4%','synthetic'],['awaiting_review','43','synthetic']]);toast('Synthetic report CSV exported.');return;
case'exportTranscript':downloadCsv('call360_transcript_demo.csv',['time','speaker','question','utterance'],transcript.map(t=>[t.time,t.who,t.qid,t.text]));toast('Synthetic transcript CSV exported.');return;
case'exportEvidence':state.modal={title:'Evidence bundle (demonstration)',desc:'Proof and provenance for an independent reviewer.',message:'Production export contains manifest and checksum, recordings (if authorized), transcript and addenda, exact script version, questions and answers, rule results, case event log, human approvals and access log. This HTML has no real audio.'};break;
case'copyJson':{let s=document.getElementById('jsonOutput')?.textContent||'';navigator.clipboard?.writeText(s).then(()=>toast('Demo structured JSON copied.')).catch(()=>toast('Clipboard unavailable in this browser context.'));return;}
case'downloadJson':{let s=document.getElementById('jsonOutput')?.textContent||'';downloadFile('call360_structured_answers_demo.json',s,'application/json');toast('Demo structured output downloaded.');return;}
case'sync':{writeAudit('Mock source sync','intake-adapter','Synthetic policy/party/risk records refreshed');toast('Mock source reconciliation finished (no external API called).');break;}
case'importJson':{try{let s=document.getElementById('intakeJson').value;let o=JSON.parse(s);for(let k of ['source','policy','customer','sale','sbq_risk'])if(!o[k])throw Error('Missing '+k);writeAudit('Manual payload validated','synthetic-sale-intake',`Imported demo payload ${o.policy.policy_number||'no policy reference'}`);toast('JSON validated. Demonstration intake event recorded.');}catch(e){toast('Import rejected: '+e.message);}return;}
case'apiDocs':state.modal={title:'Proposed policy intake API',desc:'Contract-first integration architecture.',message:'Use idempotent POST ingestion, source correlation IDs, per-field provenance, schema versioning, duplicate detection, field-level conflicts and audit logs. Source adapters can be mocks today and company-managed APIs later.'};break;
case'inviteUser':if(!authAdmin())return;state.modal={title:'Identity invitation and group mapping',desc:'Only administrators can manage user access.',message:'In enterprise deployment, SSO groups supply authoritative user membership. Do not directly edit external directory accounts from Call360 unless explicitly approved.'};break;
case'createCase':{let id=document.getElementById('newPolicy')?.value.trim().toUpperCase(),name=document.getElementById('newCustomer')?.value.trim(),family=document.getElementById('newFamily')?.value,risk=document.getElementById('newRisk')?.value,premium=Number(document.getElementById('newPremium')?.value||0),role=document.getElementById('newContactRole')?.value;if(!id||!name||premium<=0||policies.some(p=>p.id===id)){toast('Provide unique policy ID, customer and positive annual premium.');return;}let script=scripts.find(s=>s.family===family&&s.status==='Published')||scripts[0];let num=String(10500+cases.length);let cid='CB-2026-'+num;policies.unshift({id,customer:name,client:'CUST-DEMO-'+num,product:family+' test product',family,premium,frequency:'Annual',risk,score:risk==='High'?82:risk==='Medium'?55:23,channel:'Controlled manual injection',sale:'Local demo',date:'2026-11-15',fsc:'FSC-DEMO-001',contact:name,mobile:'+65 •••• ••••',income:'Unknown',fhr:'Unknown',gap:'Unknown',customerRole:role,case:cid,factors:['Manual synthetic risk assignment'],source:'Controlled manual intake'});cases.unshift({id:cid,pid:id,status:'Scheduled',attempts:0,latest:'—',updated:'Just now',due:'2026-11-16',owner:state.user,script:script.name+' v'+script.version,scriptId:script.id,review:'—',outcome:'Pending',duration:'—',risk,language:'English',channel:'Browser',recording:'Not started',completed:''});writeAudit('Callback case created',cid,'Manual demo entry for '+id);state.modal=null;toast('Synthetic case '+cid+' created and routed.');navTo('cases');return;}
case'searchHelp':state.modal={title:'Search design',desc:'One global entry point for the entire application.',message:'Production search uses identity-scoped full-text indexes and filters for policy, parties, FSC, sale risk, attempts, transcript segments, script versions, outcomes, dates and evidentiary sources. Every hit deep-links to the underlying object.'};break;
case'runSearch':state.activeSearch=document.getElementById('searchPageInput')?.value||state.activeSearch;break;
case'clearFilters':state.query='';state.filters={caseStatus:'all',risk:'all',policy:'all'};break;
default:if(act==='noop')return;toast('Demo action: '+act+' (not connected to a backend).');return;
}render();}
function downloadCsv(name,headers,rows){let all=[headers,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadFile(name,all,'text/csv;charset=utf-8')}
function downloadFile(name,text,mime){let url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
document.addEventListener('click',e=>{let target=e.target.closest('[data-page],[data-open-case],[data-open-policy],[data-script],[data-question],[data-act],[data-filter],[data-detail-tab],[data-review],[data-seek],[data-evidence-seek],[data-scope],[data-rule-toggle],[data-voice-answer],[data-signin],[data-search-result]');if(!target)return;if((target.classList.contains('drawer-backdrop')||target.classList.contains('modal-backdrop'))&&e.target!==target)return;if(target.dataset.page){if(target.dataset.adminTab)state.role==='USER'?toast('Audit access restricted by role in real application.'):void 0;return navTo(target.dataset.page)}if(target.dataset.openCase)return openCase(target.dataset.openCase);if(target.dataset.openPolicy)return openPolicy(target.dataset.openPolicy);if(target.dataset.script){state.selectedScript=target.dataset.script;state.scriptQ=findScript(state.selectedScript).questions[0].id;return render()}if(target.dataset.question){state.scriptQ=target.dataset.question;return render()}if(target.dataset.detailTab){state.detailTab=target.dataset.detailTab;return render()}if(target.dataset.review){state.activeReview=target.dataset.review;return render()}if(target.dataset.seek!==undefined||target.dataset.evidenceSeek!==undefined){state.recordingSeconds=Number(target.dataset.seek??target.dataset.evidenceSeek);state.detailTab='transcript';render();document.getElementById('recordSeek')?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}if(target.dataset.scope){state.searchScope=target.dataset.scope;return render()}if(target.dataset.ruleToggle){if(!authAdmin())return;let r=rules.find(x=>x.id===target.dataset.ruleToggle);if(r){r.enabled=!r.enabled;writeAudit('Assignment rule state modified',r.id,'Enabled='+r.enabled+' · demo-only override');toast('Demo rule toggled; production requires versioning and approval.');render()}return;}if(target.dataset.voiceAnswer){if(!state.voice.running){toast('Start the simulated session first.');return;}state.voice.seconds+=19;toast('Simulated answer: '+target.dataset.voiceAnswer+' — backend evaluation illustrated only.');return;}if(target.dataset.signin){state.role=target.dataset.signin;state.user=state.role==='ADMIN'?'Maya Chen':'Jia Hui';state.modal=null;state.login=true;state.page='overview';writeAudit('Demo user changed','local-prototype','Role '+state.role+' (not real authentication)');render();toast('Switched to '+state.role+' demo role.');return;}if(target.dataset.searchResult)return doAction(target.dataset.searchResult,target);if(target.dataset.act)return doAction(target.dataset.act,target)});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.filter){state.filters[t.dataset.filter]=t.value;render()}if(t.id==='assignmentPolicy'){state.selectedPolicy=t.value}if(t.id==='riskPolicySelect'){state.selectedPolicy=t.value;render()}if(t.id==='recordSeek'){state.recordingSeconds=Number(t.value);render()}if(t.id==='reportRange'){state.reportRange=t.value;toast('Report period updated (illustrative data).')}});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.filterInput){state.query=t.value;let pos=t.selectionStart;render();let x=document.querySelector('[data-filter-input]');if(x){x.focus();x.setSelectionRange(pos,pos)}}if(t.id==='recordSeek'){state.recordingSeconds=Number(t.value);let current=document.getElementById('audioCurrent');if(current)current.textContent=timeclock(state.recordingSeconds);t.style.background=`linear-gradient(to right,#c83c51 ${state.recordingSeconds/511*100}%,#e3e6ec ${state.recordingSeconds/511*100}%)`;}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus();document.getElementById('globalSearch')?.select()}if(e.key==='Escape'){if(state.modal||state.drawer){state.modal=null;state.drawer=null;render()}}if(e.key==='Enter'&&e.target.id==='globalSearch'){state.activeSearch=e.target.value;navTo('search')}if(e.key==='Enter'&&e.target.id==='searchPageInput'){state.activeSearch=e.target.value;render()}});
setInterval(()=>{if(state.playback&&state.page==='detail'&&state.recordingSeconds<511){state.recordingSeconds+=1;let seek=document.getElementById('recordSeek');if(seek){seek.value=state.recordingSeconds;seek.style.background=`linear-gradient(to right,#c83c51 ${state.recordingSeconds/511*100}%,#e3e6ec ${state.recordingSeconds/511*100}%)`;}let el=document.getElementById('audioCurrent');if(el)el.textContent=timeclock(state.recordingSeconds)}else if(state.recordingSeconds>=511)state.playback=false;if(state.voice.running)state.voice.seconds+=1;},1000);
render();
</script>
</body>
