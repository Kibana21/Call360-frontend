# Default gitleaks rules plus ONE narrow allowlist: the public OpenAPI contract checksum in the lock file
# (a SHA-256 of a committed public document, not a credential) matches the generic-api-key pattern.
[extend]
useDefault = true

[[allowlists]]
description = "Public OpenAPI contract checksum (ADR-0006 contract.lock.json)"
paths = ['''src/api/contract\.lock\.json$''']
regexes = ['''"openapi_sha256": "[0-9a-f]{64}"''']

# ---- Call360-specific rules (CP0.1A scanner-coverage fix) --------------------------------------
# gitleaks' default rules never match PostgreSQL URLs with embedded passwords, and its generic rule
# skips ~3% of random values. These rules are deterministic for the secret formats Call360 uses.
# Placeholders are excluded by construction: values containing < > { } $ are never matched, so
# `<password>`, `<generated>`, `{password}` and `${VAR}` in examples and templates do not fire.

[[rules]]
id = "call360-postgres-url-credentials"
description = "PostgreSQL connection string with an embedded password"
regex = '''(?i)\bpostgres(?:ql)?(?:\+[a-z0-9]+)?://[^\s:/@'"`<>{}$]+:([^\s@'"`<>{}$]{3,})@'''
secretGroup = 1
keywords = ["postgres"]

[[rules]]
id = "call360-secret-assignment"
description = "Call360 secret, pepper, password or token assigned in env/config/constant style"
regex = '''(?m)^[ \t]*(?:export[ \t]+)?(?:[A-Z0-9]+_)*(?:REFRESH_TOKEN_PEPPER|CSRF_SECRET|ENCRYPTION_KEY|HMAC_KEY|PASSWORD|PASSWD|SECRET|PEPPER|PRIVATE_KEY|API_KEY|TOKEN)[ \t]*=[ \t]*["']?([^\s"'<>{}$#]{8,})'''
secretGroup = 1
keywords = ["pepper", "secret", "password", "passwd", "token", "private_key", "api_key", "encryption_key", "hmac_key"]

  [[rules.allowlists]]
  description = "Synthetic test-fixture password used only against schema call360_test (tests/support.py)"
  regexTarget = "secret"
  regexes = ['''^Correct-Horse-Battery-9$''']
